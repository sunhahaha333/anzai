<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>安仔开抢三代 · 云端看单</title>
<meta name="appver" content="anzai-v3.3">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f2f4f7;color:#222;padding-bottom:20px}
.hd{position:sticky;top:0;background:#fff;padding:10px 12px 8px;box-shadow:0 1px 4px rgba(0,0,0,.08);z-index:10}
.hd h1{font-size:17px;display:flex;align-items:center;justify-content:space-between}
.hd .sub{font-size:11px;color:#888;margin-top:2px}
.gear{background:none;border:none;font-size:20px;cursor:pointer;padding:0 4px}
.agg{background:#fff3f3;color:#c0392b;padding:7px 12px;font-size:12px;font-weight:600;border-bottom:1px solid #fdd}
.pbar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:8px 8px 4px;background:#fff}
.pchip{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f7f7f7;border-radius:8px;padding:4px 2px;font-size:11px;color:#555;line-height:1.3}
.pchip .dot{width:8px;height:8px;border-radius:50%;margin-bottom:2px}
.pchip.on .dot{background:#27ae60}.pchip.off .dot{background:#bbb}.pchip.sold .dot{background:#e74c3c}.pchip.under .dot{background:#f39c12}
.pchip.on{background:#eafaf1;color:#155724}.pchip.sold{background:#fdf0f0;color:#721c24}.pchip.under{background:#fff8e6;color:#856404}
.legend{display:flex;gap:12px;align-items:center;background:#fff;padding:4px 10px 7px;font-size:10px;color:#888;border-bottom:1px solid #eee;flex-wrap:wrap}
.lg{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:2px}
.lg.on{background:#27ae60}.lg.off{background:#bbb}.lg.sold{background:#e74c3c}.lg.under{background:#f39c12}
.tabs{display:flex;background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:9}
.tabs button{flex:1;padding:9px 0;border:none;background:#fff;font-size:13px;color:#666;border-bottom:2px solid transparent}
.tabs button.on{color:#1a73e8;border-bottom-color:#1a73e8;font-weight:700}
.card{background:#fff;border-radius:10px;margin:7px 8px;padding:9px 10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card .top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.key{font-size:15px;font-weight:800;color:#1a73e8}
.badge{padding:1px 7px;border-radius:9px;font-size:11px;font-weight:600}
.badge.unpaid{background:#f8d7da;color:#c0392b}.badge.paid{background:#d4edda;color:#155724}.badge.other{background:#eee;color:#666}
.cd{font-size:12px;color:#c0392b;font-weight:700}
.pname{font-size:13.5px;font-weight:600;margin-top:4px}
.price{color:#c0392b;font-weight:700;margin-left:5px;font-size:13px}
.addr{font-size:11px;color:#666;margin-top:3px;line-height:1.4;word-break:break-all}
.remark{font-size:11px;color:#1a73e8;background:#e8f0fe;padding:2px 7px;border-radius:7px;margin-top:4px;display:inline-block;max-width:100%;word-break:break-all}
.btns{display:flex;gap:6px;margin-top:7px}
.btn{flex:1;padding:7px 0;border:none;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer}
.btn.qr{background:#1a73e8;color:#fff}.btn.rem{background:#fff;color:#1a73e8;border:1px solid #1a73e8}
.btn.del{background:#fff;color:#c0392b;border:1px solid #c0392b}
.btn.mini{flex:0 0 auto;padding:5px 16px;font-size:12px;background:#1a73e8;color:#fff;border:none;border-radius:7px}
.btn:active{opacity:.7}
.acard{background:#fff;border-radius:10px;margin:8px;overflow:hidden;border:2px solid #2d8cf0;box-shadow:0 1px 3px rgba(45,140,240,.15)}
.ahead{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f8fafc;border-bottom:1px solid #f0f0f0;flex-wrap:wrap}
.aaddr{font-size:11px;color:#666;line-height:1.4;flex:1;min-width:150px}
.arow{padding:8px 10px;border-top:1px solid #f5f5f5}
.want{font-size:11px;font-weight:700;color:#e67e22;background:#fef3e2;padding:1px 6px;border-radius:7px}
.wanttag{font-size:11px;font-weight:700;color:#1a73e8;background:#e8f0fe;padding:2px 7px;border-radius:7px;white-space:nowrap}
.empty{text-align:center;color:#aaa;padding:24px 0;font-size:12px}
.dgroup{margin:6px 8px}
.dhead{display:flex;align-items:center;gap:6px;background:#fff;border-radius:8px;padding:7px 10px;font-size:12.5px;font-weight:600;color:#444}
.tri{display:inline-block;font-size:10px;color:#999}
.dbody .card{margin:6px 0 0}
.login{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:50}
.login h2{font-size:19px}.login input{padding:9px 14px;font-size:16px;border:1px solid #ddd;border-radius:10px;width:220px;text-align:center}
.login button{padding:9px 30px;font-size:15px;background:#1a73e8;color:#fff;border:none;border-radius:10px}
.err{color:#c0392b;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:60}
.modal .box{background:#fff;border-radius:14px;padding:16px;width:88%;max-width:340px;text-align:center}
.qr-addr{font-size:14px;font-weight:700;color:#333;background:#f5f7fa;border-radius:8px;padding:9px;margin-bottom:10px;line-height:1.6;text-align:left;word-break:break-all}
.qr-addr b{color:#1a73e8}
.modal img{width:100%;max-width:260px;border-radius:8px}
.modal .tip{font-size:12px;color:#666;margin-top:10px;line-height:1.6}
.modal .close{margin-top:12px;padding:8px 26px;border:none;border-radius:10px;background:#eee;font-size:13px}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;font-size:13px;border-bottom:1px solid #f0f0f0}
.ship-st{font-weight:700}
.ship-st.s0{color:#888}.ship-st.s1{color:#1a73e8}.ship-st.s2{color:#e67e22}.ship-st.s3{color:#27ae60}
</style>
<meta name="theme-color" content="#1a73e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div class="login" id="loginBox">
  <h2>安仔开抢三代 · 云端（V3.3）</h2>
  <input type="password" id="pw" placeholder="输入密码" inputmode="numeric">
  <input type="text" id="key" placeholder="数据密钥(以 nfapp_ 开头)" autocomplete="off" style="-webkit-text-security:disc">
  <button onclick="login()">登录</button>
  <div style="font-size:11px;color:#888;margin:2px 0 8px;text-align:left">数据密钥=电脑开抢窗口打印的 nfapp_… 一长串（看 手机看单_config.json 的 view_key）</div>
  <div class="err" id="loginErr"></div>
</div>

<div id="app" style="display:none">
  <div class="hd">
    <h1>安仔开抢三代 <button class="gear" onclick="openSettings()">⚙️</button></h1>
    <div class="sub" id="subInfo"></div>
  </div>
  <div class="agg" id="aggBar" style="display:none"></div>
  <div class="pbar" id="pbar"></div>
  <div class="legend"><span class="lg on"></span>上架&nbsp;&nbsp;&nbsp;<span class="lg off"></span>未上架</div>
  <div class="tabs">
    <button id="tabCur" class="on" onclick="showTab('cur')">当前订单</button>
    <button id="tabShip" onclick="showTab('ship')">发货状态</button>
    <button id="tabHis" onclick="showTab('his')">历史订单</button>
  </div>
  <div id="curBox"></div>
  <div id="shipBox" style="display:none"></div>
  <div id="hisBox" style="display:none"></div>
</div>

<div class="modal" id="qrModal">
  <div class="box">
    <div id="qrAddr" class="qr-addr"></div>
    <img id="qrImg" src="">
    <div class="tip">长按/截图保存二维码<br>微信「扫一扫 → 相册」选图付款</div>
    <button class="close" onclick="closeQr()">关闭</button>
  </div>
</div>

<div class="modal" id="setModal">
  <div class="box">
    <div style="font-weight:700;margin-bottom:8px">设置</div>
    <div class="set-row"><span>抢到提示音</span><button class="btn mini" id="btnSound" onclick="toggle('sound')">开</button></div>
    <div class="set-row"><span>抢到振动</span><button class="btn mini" id="btnVib" onclick="toggle('vib')">开</button></div>
    <div class="set-row"><span>测试提示</span><button class="btn mini" onclick="testAlert()">响+振一下</button></div>
    <div class="tip" style="text-align:left;font-size:11px">提示：苹果iPhone不支持振动（系统限制）；安卓要页面开着才振。声音首次要先点一下屏幕解锁后才会响。</div>
    <button class="close" onclick="closeSet()">关闭</button>
  </div>
</div>

      return '<div class="card"><div class="top"><span class="key">'+esc(o.account)+'</span><span class="badge other ship-st '+sl[1]+'">'+sl[0]+'</span><span style="font-size:11px;color:#999">'+esc(o.payTime)+'</span></div><div class="pname">'+esc(o.goods)+'</div><div class="addr">'+(o.buyer?esc(o.buyer)+" ":"")+esc(o.recv)+'</div>'+(o.code?'<div class="addr">单号:'+esc(o.code)+'　'+esc(o.cp)+'</div>':'')+'</div>';
    }).join("");
    var open=(expanded[dt]===false)?' style="display:none"':"";
    var tri=(expanded[dt]===false)?"▸":"▾";
    h+='<div class="dgroup"><div class="dhead" onclick="toggleGroup(this,\''+dt+'\')"><span class="tri">'+tri+'</span> '+dt+'（'+groups[dt].length+'单）</div><div class="dbody"'+open+'>'+cards+'</div></div>';
  });
  box.innerHTML=h;
}
function openQr(key){
  var o=null;
  ordersCache.forEach(function(x){ if(x.key===key) o=x; });
  var addrTxt=o?('<b>'+esc(o.name||"")+' '+esc(o.tele||"")+'</b><br>'+esc(o.address||"")):esc(key);
  $("qrAddr").innerHTML=addrTxt;
  if(o && o.codeUrl){
    try{
      var qr=qrcode(0,"M"); qr.addData(o.codeUrl); qr.make();
      var du=(typeof qr.createDataURL==="function")?qr.createDataURL(5,6):"";
      if(!du){ var mm=qr.createImgTag(5,6).match(/src="([^"]+)"/); du=mm?mm[1]:""; }
      if(du){ $("qrImg").src=du; $("qrImg").style.display="block"; }
      else { $("qrImg").style.display="none"; $("qrAddr").innerHTML=addrTxt+'<br><b style="color:#c0392b">付款码生成失败，稍后刷新重试</b>'; }
    }catch(e){ $("qrImg").style.display="none"; $("qrAddr").innerHTML=addrTxt+'<br><b style="color:#c0392b">付款码生成失败</b>'; }
  } else {
    $("qrImg").style.display="none";
    $("qrAddr").innerHTML=addrTxt+'<br><b style="color:#c0392b">付款码还没同步到云端，等几秒自动刷新后再点</b>';
  }
  $("qrModal").style.display="flex";
}
function closeQr(){ $("qrModal").style.display="none"; }
function remark(key){ alert("备注请在电脑端【付款订单三代】操作"); }
function delOrder(key){ alert("删除请在电脑端【付款订单三代】操作"); }
document.addEventListener("click", function(){ try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} });
function autoLogin(){
  var k=getKey();
  if(k && /^nfapp_/.test(k)){ $("loginBox").style.display="none"; $("app").style.display="block"; start(); }
  else { $("loginBox").style.display="flex"; }
}

var APP_VER = "anzai-v3.3";
function checkVer(){
  try{
    fetch("index.html?ver=" + Date.now(), {cache:"no-store"}).then(function(r){ return r.text(); }).then(function(t){
      var m = t.match(/name="appver" content="([^"]+)"/);
      if(m && m[1] && m[1] !== APP_VER && !document.getElementById("verBanner")){
        var b = document.createElement("div");
        b.id = "verBanner";
        b.style.cssText = "position:fixed;left:10px;right:10px;bottom:12px;z-index:99;background:#1a73e8;color:#fff;border-radius:10px;padding:12px 14px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.25)";
        b.innerHTML = "发现新版本（V" + m[1].replace("anzai-v","") + "），点此刷新加载最新版 <span style='float:right;font-weight:800'>刷新</span>";
        b.onclick = function(){ location.reload(); };
        document.body.appendChild(b);
        setTimeout(function(){ try{ document.body.removeChild(b); }catch(e){} }, 15000);
      }
    }).catch(function(){});
  }catch(e){}
}
setInterval(checkVer, 20000);

document.addEventListener("visibilitychange", function(){ if(!document.hidden) loadState(); });
window.addEventListener("load", autoLogin);

</script>
